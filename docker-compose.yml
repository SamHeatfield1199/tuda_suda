services:
  app:
    build: .
    container_name: tudasuda-app
    working_dir: /app
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/node_modules
      - ./data:/app/data
      - /app/.next
    environment:
      NODE_ENV: development
      DATABASE_URL: /app/data/app.db
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    command: npm run dev -- --webpack --hostname 0.0.0.0
